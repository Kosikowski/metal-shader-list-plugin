name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    name: macOS (Xcode latest-stable)
    steps:
      - uses: actions/checkout@v6
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
      - name: Build and Test
        run: |
          swift build -v
          swift test -v

  build-linux:
    runs-on: ubuntu-22.04
    name: Linux (Swift ${{ matrix.swift-version }})
    strategy:
      matrix:
        swift-version: [6.1.2]
    steps:
      - uses: actions/checkout@v6
      - name: Install Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Show Swift version
        run: swift --version
      - name: Build and Test
        run: |
          swift build -v
          swift test -v

  build-linux-release:
    runs-on: ubuntu-22.04
    name: Linux Release (Swift ${{ matrix.swift-version }})
    strategy:
      matrix:
        swift-version: [6.1.2]
    steps:
      - uses: actions/checkout@v6
      - name: Install Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Show Swift version
        run: swift --version
      - name: Build and Test Release
        run: |
          swift build -c release -v
          swift test -c release -v

  build-windows:
    runs-on: windows-latest
    name: Windows (Swift ${{ matrix.swift-version }})
    strategy:
      matrix:
        swift-version: [6.1.2]
    steps:
      - uses: actions/checkout@v6
      - name: Install Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Show Swift version
        run: swift --version
      - name: Build and Test
        run: |
          swift build -v
          swift test -v

  build-windows-release:
    runs-on: windows-latest
    name: Windows Release (Swift ${{ matrix.swift-version }})
    strategy:
      matrix:
        swift-version: [6.1.2]
    steps:
      - uses: actions/checkout@v6
      - name: Install Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Show Swift version
        run: swift --version
      - name: Build and Test Release
        run: |
          swift build -c release -v
          swift test -c release -v

  code-quality:
    name: Code Quality
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install SwiftFormat and SwiftLint
      run: brew install swiftformat swiftlint

    - name: Check SwiftFormat
      run: swiftformat --lint --config .swiftformat Sources Plugins Tests

    - name: Check SwiftLint
      run: swiftlint lint --strict --quiet

    - name: Check for TODO/FIXME comments
      run: |
        echo "Checking for TODO/FIXME comments..."
        if grep -r "TODO\|FIXME" Sources/ Plugins/ Tests/; then
          echo "Found TODO/FIXME comments. Please address them before merging."
          exit 1
        fi

    - name: Check for debug print statements
      run: |
        echo "Checking for debug print statements..."
        if grep -r "print(" Sources/ Plugins/ | grep -v "//.*print("; then
          echo "Found print statements. Please remove them before merging."
          exit 1
        fi

  package-validation:
    name: Package Validation
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Swift
      uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: '6.1.2'

    - name: Check package description
      run: swift package describe

    - name: Validate package structure
      run: swift package dump-package

    - name: Check for unused dependencies
      run: swift package show-dependencies

  release:
    name: Create Release
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux, build-linux-release, build-windows, build-windows-release, code-quality, package-validation]
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Generate Release Notes
      run: |
        CURRENT_TAG="${{ github.ref_name }}"
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

        if [ -n "$PREVIOUS_TAG" ]; then
          echo "Generating release notes from $PREVIOUS_TAG to $CURRENT_TAG"
          COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges "$PREVIOUS_TAG..HEAD")
        else
          echo "First release, generating release notes from all commits"
          COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
        fi

        {
          echo "## What's Changed in $CURRENT_TAG"
          echo
          echo "$COMMITS"
          echo
          echo "## Installation"
          echo
          echo '```swift'
          echo ".package(url: \"https://github.com/Kosikowski/metal-shader-list-plugin.git\", from: \"${CURRENT_TAG#v}\")"
          echo '```'
        } > RELEASE_NOTES.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        body_path: RELEASE_NOTES.md
